# 文件作用：G1 人物检测/ROI/逐帧记录示例，篮球按用户要求暂不启用。
# 将 source/weights 换成实际文件，另存 g1.indoor.local.yaml（Git 忽略）。
source: ../data/input/game.mp4
weights: ../models/yolo.pt
output_dir: ../runs
undistort: none
device: cpu
start_seconds: 30
max_frames: 0
detect_interval: 1
detection_policy: detection.indoor.example.yaml
export_detections: true
codec: mp4v
debug_video: true
preview: false
